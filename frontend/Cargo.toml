[package]
edition.workspace = true
name = "foxide-frontend"
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
console_error_panic_hook = { workspace = true }
foxide-types = { workspace = true }
js-sys = "0.3"
rmp-serde = { workspace = true }
strum = { workspace = true }
url = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "MessageEvent",
    "WebSocket",
    "Window",
] }
yew = { workspace = true }
yew-router = { workspace = true }

[[bin]]
name = "foxide-frontend"
path = "src/main.rs"
