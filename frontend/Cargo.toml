[package]
edition.workspace = true
name = "filebrowser-frontend"
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
filebrowser-types = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
rmp-serde = { workspace = true }
strum = { workspace = true }
url = { version = "2.5", features = ["serde"] }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlDocument"] }

[features]
hydrate = ["dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys", "leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
