[package]
edition.workspace = true
name = "filebrowser-frontend"
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { workspace = true, optional = true }
filebrowser-types = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
strum = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlDocument"] }
wincode = { workspace = true }

[features]
hydrate = ["dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys", "leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
