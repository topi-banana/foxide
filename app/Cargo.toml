[package]
name = "filebrowser-app"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "filebrowser-app"
path = "src/main.rs"

[dependencies]
leptos = { workspace = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
filebrowser-frontend = { workspace = true }
filebrowser-backend = { workspace = true }
filebrowser-types = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = []
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "filebrowser-frontend/ssr",
    "filebrowser-backend/ssr",
]
