[package]
edition.workspace = true
name = "filebrowser-app"
version.workspace = true

[dependencies]
axum = { workspace = true, optional = true }
filebrowser-backend = { workspace = true, optional = true }
filebrowser-frontend = { workspace = true }
leptos = { workspace = true }
leptos_axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"], optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["filebrowser-frontend", "leptos_axum", "tower-http"]

[features]
default = []
ssr = [
    "dep:axum",
    "dep:filebrowser-backend",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "filebrowser-frontend/ssr",
    "leptos/ssr",
]
