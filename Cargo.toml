[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace]
members = ["app", "backend", "frontend", "types"]
resolver = "3"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = { version = "0.1" }
foxide-app = { path = "app" }
foxide-backend = { path = "backend" }
foxide-frontend = { path = "frontend" }
foxide-types = { path = "types" }
futures = { version = "0.3" }
rand = { version = "0.10" }
reqwest = { version = "0.13", features = ["form", "json"] }
rmp-serde = { version = "1.3.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serenity = { version = "0.12" }
sha2 = { version = "0.11" }
sled = { version = "0.34" }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1" }
tower-cookies = { version = "0.11" }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
wasm-bindgen = { version = "0.2" }
yew = { version = "0.23", features = ["csr"] }
yew-router = { version = "0.18" }

[profile.wasm-release]
codegen-units = 1
inherits = "release"
lto = true
opt-level = 'z'
