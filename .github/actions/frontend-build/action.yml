name: Frontend Build
description: Build the WASM frontend (trunk + tailwindcss + daisyUI) into dist/

runs:
  using: composite
  steps:
    - shell: bash
      run: rustup target add wasm32-unknown-unknown

    - uses: jetli/trunk-action@v0.5.1

    - name: Download tailwindcss / daisyUI
      shell: bash
      working-directory: frontend
      run: |
        curl -sLo tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
        curl -sLO https://github.com/saadeghi/daisyui/releases/latest/download/daisyui.mjs
        curl -sLO https://github.com/saadeghi/daisyui/releases/latest/download/daisyui-theme.mjs
        chmod +x tailwindcss

    - name: trunk build
      shell: bash
      working-directory: frontend
      run: trunk build --release
